name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check source protobuf against sing-box
        run: |
          curl --fail --location --retry 3 https://raw.githubusercontent.com/CHIZI-0618/sing-box/ebpf-inbound/daemon/started_service.proto -o /tmp/sing-box-started_service.proto
          diff -u /tmp/sing-box-started_service.proto proto/daemon/started_service.proto
      - run: pnpm generate
      - run: pnpm lint
      - run: pnpm lint:css
      - run: pnpm test
      - run: pnpm build
